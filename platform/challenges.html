{% extends "base.html" %}

{% block content %}
  <div class="jumbotron">
    <div class="container">
      <h1>
        {% trans %}Challenges{% endtrans %}
      </h1>
    </div>
  </div>

  <div class="container">
    <div class="row">
      <div class="col-md-12">
        {% include "components/errors.html" %}
      </div>
    </div>

    <div 
      x-data="ChallengeBoard" 
      @load-challenges.window="loadChallenges()" 
      @load-challenge.window="loadChallenge($event.detail)"
    >
      <div
          x-ref="challengeWindow" id="challenge-window" class="modal fade" tabindex="-1" role="dialog" x-data=""
          x-html="$store.challenge.data.view"
      ></div>

      <div x-show="!loaded">
        <div class="min-vh-50 d-flex align-items-center">
          <div class="text-center w-100">
            <i class="fas fa-circle-notch fa-spin fa-3x fa-fw spinner"></i>
          </div>
        </div>
      </div>

      <div x-show="loaded">
        <template x-for="(category, idx) in getCategories()" :key="idx">
          <div class="pt-5">
            <div class="category-header mb-3">
              <h3 x-text="category"></h3>
            </div>

            <div class="category-challenges d-flex flex-column">
              <div class="challenges-row row">
                <template x-for="(c, idx) in getChallenges(category)" :key="c.id">
                  <div class="col-sm-6 col-md-4 col-lg-3 my-3">
                    <button
                        class="challenge-button btn w-100 h-100"
                        :class="[
                          c.solved_by_me ? 'challenge-solved btn-dark' : (c.type === 'hidden' ? 'challenge-locked' : 'btn-dark'),
                          ...c.tags.map((tag) => `tag-${tag.value.replace(/ /g, '-')}`),
                        ];"
                        :disabled="c.type === 'hidden'"
                        :title="c.type === 'hidden' ? '🔒 Stage locked: Complete prerequisite challenge first to unlock.' : c.name"
                        :value="c.id" 
                        @click="c.type !== 'hidden' && loadChallenge(c.id)"
                    >
                      <div class="challenge-inner my-3">
                        <template x-if="c.type === 'hidden'">
                          <div class="mb-2">
                            <i class="fas fa-lock fa-2x text-warning"></i>
                          </div>
                        </template>
                        <p x-text="c.name" :class="c.type === 'hidden' ? 'text-muted fw-bold' : ''"></p>
                        <template x-if="c.type === 'hidden'">
                          <span class="badge bg-dark border border-secondary text-warning">
                            <i class="fas fa-lock me-1"></i> LOCKED
                          </span>
                        </template>
                        <template x-if="c.type !== 'hidden'">
                          <span x-text="c.value"></span>
                        </template>
                      </div>
                    </button>
                  </div>
                </template>
              </div>
            </div>
          </div>
        </template>
      </div>
    </div>
  </div>

  <style>
    .challenge-locked {
      background: linear-gradient(145deg, #212529, #1a1d20) !important;
      border: 2px dashed #495057 !important;
      opacity: 0.65 !important;
      cursor: not-allowed !important;
      box-shadow: none !important;
      transition: all 0.25s ease-in-out;
    }
    .challenge-locked:hover {
      background: #1a1d20 !important;
      border-color: #ffc107 !important;
      opacity: 0.8 !important;
      cursor: not-allowed !important;
      transform: none !important;
    }
    .challenge-locked p {
      color: #8c959f !important;
    }
  </style>
{% endblock %}

{% block scripts %}
  {{ Assets.js("assets/js/challenges.js") }}
  <script>
    (function() {
      var isUpdating = false;

      function adjustServiceUrls() {
        if (isUpdating) return;
        var currentHost = window.location.hostname;
        if (!currentHost) return;

        var modal = document.getElementById('challenge-window');
        if (!modal) return;

        isUpdating = true;
        try {
          // 1. Rewrite unadjusted anchor tags pointing to port 3000 or 8086
          var links = modal.querySelectorAll('a:not([data-host-adjusted])');
          for (var i = 0; i < links.length; i++) {
            var a = links[i];
            var href = a.getAttribute('href') || '';
            if (href.indexOf(':3000') !== -1 || href.indexOf(':8086') !== -1) {
              a.href = href.replace(/https?:\/\/[^\/:]+(:(?:3000|8086))/gi, 'http://' + currentHost + '$1');
              a.target = '_blank';
              a.rel = 'noopener noreferrer';
              if (a.textContent.indexOf(':3000') !== -1 || a.textContent.indexOf(':8086') !== -1) {
                a.textContent = a.textContent.replace(/https?:\/\/[^\/:\s]+(:(?:3000|8086))/gi, 'http://' + currentHost + '$1');
              }
            }
            a.setAttribute('data-host-adjusted', 'true');
          }
        } catch (err) {
          console.error('[CTF URL Adjust Error]:', err);
        } finally {
          isUpdating = false;
        }
      }

      // Safe event bindings: Run only when modal is displayed or challenge clicked
      var modal = document.getElementById('challenge-window');
      if (modal) {
        modal.addEventListener('shown.bs.modal', function() {
          adjustServiceUrls();
        });
      }

      document.addEventListener('click', function(e) {
        if (e.target && (e.target.closest('.challenge-button') || e.target.closest('[data-bs-target="#challenge-window"]'))) {
          setTimeout(adjustServiceUrls, 250);
        }
      });
    })();
  </script>
{% endblock %}
